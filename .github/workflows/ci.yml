name: React Vite CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Giải quyết triệt để vấn đề trống thư mục con

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cài đặt thư viện dependencies
      working-directory: first-react-app
      run: npm install

    - name: Biên dịch dự án (Build thử)
      working-directory: first-react-app
      run: npm run build --if-present
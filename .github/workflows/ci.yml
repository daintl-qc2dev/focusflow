name: React Vite CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Thiết lập mặc định: Mọi lệnh "run" sẽ được chạy bên trong thư mục first-react-app
defaults:
  run:
    working-directory: first-react-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cài đặt thư viện dependencies
      run: npm ci

    - name: Kiểm tra lỗi Code (Lint)
      run: npm run lint --if-present

    - name: Biên dịch dự án (Build thử)
      run: npm run build -- --warnOnNumberOfTshirtdesigns # Hoặc tùy chỉnh trong vite.config.js